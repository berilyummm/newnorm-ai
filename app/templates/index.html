<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewNorm AI - Geleceğin Ajansı</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme Colors */
            --bg-color: #F8FAFC;
            --text-color: #0F172A;
            --primary-color: #4F46E5; /* Indigo */
            --primary-hover: #4338CA;
            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;
            --input-bg: #F1F5F9;
            --glass-bg: rgba(255, 255, 255, 0.7);
        }

        [data-theme="dark"] {
            /* Dark Theme Colors */
            --bg-color: #0F172A;
            --text-color: #F8FAFC;
            --primary-color: #6366F1;
            --primary-hover: #4F46E5;
            --card-bg: #1E293B;
            --border-color: #334155;
            --input-bg: #0F172A;
            --glass-bg: rgba(30, 41, 59, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER (Z-Pattern Top) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: -0.5px;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* MAIN CONTENT (Z-Pattern Body) */
        main {
            flex: 1;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 40px 5%;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .form-section {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 600px;
            border: 1px solid var(--border-color);
        }

        .form-section h1 {
            font-size: 32px;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .form-section p {
            color: #64748B;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-color);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* FLOATING NOMI (Z-Pattern Bottom Right) */
        .chat-widget {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 1000;
        }

        .chat-button {
            width: 60px;
            height: 60px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
            border: none;
            transition: transform 0.2s;
        }

        .chat-button:hover {
            transform: scale(1.05);
        }

        .chat-window {
            width: 350px;
            height: 450px;
            background-color: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 15px;
            display: none; /* Hidden on load */
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            transform-origin: bottom right;
            animation: popUp 0.3s ease-out;
        }

        @keyframes popUp {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .chat-header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-close {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .bubble-ai {
            background-color: var(--card-bg);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .bubble-user {
            background-color: var(--primary-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-tools {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            justify-content: flex-start;
        }

        .tool-btn {
            background: none;
            border: none;
            color: #64748B;
            font-size: 12px;
            cursor: pointer;
            display: none; /* Only show on AI messages */
        }
        
        .bubble-ai + .chat-tools .tool-btn {
            display: inline-block;
        }
        .tool-btn:hover { color: var(--primary-color); }

        .chat-input-area {
            padding: 15px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
        }

        .chat-send, .chat-undo {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        .chat-undo {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .chat-window { width: calc(100vw - 40px); right: 20px; }
        }
    </style>
</head>
<body>

    <!-- Z-PATTERN: Top (Header) -->
    <header>
        <div class="logo">NewNorm AI</div>
        <div class="header-controls">
            <button class="btn-outline" id="btnLang">TR / EN</button>
            <button class="btn-outline" id="btnTheme">Koyu Mod 🌙</button>
        </div>
    </header>

    <!-- Z-PATTERN: Body (Form) -->
    <main>
        <div class="form-section">
            <h1>Projeye Başla</h1>
            <p>NewNorm ile yapay zeka entegrasyonu için aşağıdaki formu doldurun. Uzmanlarımız hemen sizinle iletişime geçsin.</p>
            
            <form id="leadForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Ad</label>
                        <input type="text" id="isim" required placeholder="Adınız">
                    </div>
                    <div class="form-group">
                        <label>Soyad</label>
                        <input type="text" id="soyisim" placeholder="Soyadınız">
                    </div>
                    <div class="form-group full-width">
                        <label>E-Posta</label>
                        <input type="email" id="eposta" placeholder="ornek@sirket.com">
                    </div>
                    <div class="form-group">
                        <label>Alan Kodu</label>
                        <select id="alan_kodu">
                            <option value="+90">Türkiye (+90)</option>
                            <option value="+1">ABD (+1)</option>
                            <option value="+44">İngiltere (+44)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Telefon Numarası</label>
                        <input type="tel" id="telefon" required placeholder="555 123 4567">
                    </div>
                    <div class="form-group full-width">
                        <label>Bütçe Aralığı</label>
                        <select id="butce">
                            <option value="10k-50k">10.000₺ - 50.000₺</option>
                            <option value="50k-100k">50.000₺ - 100.000₺</option>
                            <option value="100k+">100.000₺ Üzeri</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label>Proje Açıklaması</label>
                        <textarea id="aciklama" rows="3" placeholder="Nasıl bir yapay zeka çözümüne ihtiyacınız var?"></textarea>
                    </div>
                    <div class="form-group full-width">
                        <button type="button" class="btn-primary" id="btnSubmitForm">Hemen Başvur</button>
                    </div>
                </div>
                <div id="formStatus" style="margin-top: 15px; font-weight: 500; font-size: 14px;"></div>
            </form>
        </div>
    </main>

    <!-- Z-PATTERN: Bottom Right (Floating Nomi) -->
    <div class="chat-widget">
        <div class="chat-window" id="chatWindow">
            <div class="chat-header">
                Nomi Asistan 🤖
                <button class="chat-close" id="btnCloseChat">×</button>
            </div>
            <div class="chat-body" id="chatBody">
                <div class="chat-bubble bubble-ai">
                    Merhaba! Ben Nomi, NewNorm AI'ın yapay zeka asistanıyım. Sana nasıl yardımcı olabilirim?
                </div>
                <div class="chat-tools">
                    <button class="tool-btn copy-btn" onclick="copyLastAiMessage(this)">Kopyala 📋</button>
                </div>
            </div>
            <div class="chat-input-area">
                <button class="chat-undo" id="btnUndo" title="Geri Al">↩</button>
                <input type="text" id="chatInput" placeholder="Nomi'ye sor...">
                <button class="chat-send" id="btnSendChat">➤</button>
            </div>
        </div>
        <button class="chat-button" id="btnOpenChat">💬</button>
    </div>

    <script>
        // --- 1. THEME TOGGLE ---
        const btnTheme = document.getElementById('btnTheme');
        let isDark = false;
        btnTheme.addEventListener('click', () => {
            isDark = !isDark;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            btnTheme.innerText = isDark ? "Açık Mod ☀️" : "Koyu Mod 🌙";
        });

        // --- 2. FLOATING CHAT LOGIC ---
        const btnOpenChat = document.getElementById('btnOpenChat');
        const btnCloseChat = document.getElementById('btnCloseChat');
        const chatWindow = document.getElementById('chatWindow');
        
        btnOpenChat.addEventListener('click', () => {
            chatWindow.style.display = 'flex';
            btnOpenChat.style.display = 'none';
        });

        btnCloseChat.addEventListener('click', () => {
            chatWindow.style.display = 'none';
            btnOpenChat.style.display = 'flex';
        });

        // --- 3. CHAT API & TOOLS ---
        const btnSendChat = document.getElementById('btnSendChat');
        const chatInput = document.getElementById('chatInput');
        const chatBody = document.getElementById('chatBody');
        const btnUndo = document.getElementById('btnUndo');
        
        let chatHistory = [];
        let lastUserMessage = "";

        function addMessage(text, sender) {
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble bubble-${sender}`;
            bubble.innerText = text;
            chatBody.appendChild(bubble);
            
            if(sender === 'ai') {
                const tools = document.createElement('div');
                tools.className = 'chat-tools';
                tools.innerHTML = `<button class="tool-btn copy-btn" onclick="copyMessage(this, '${text.replace(/'/g, "\\'")}')">Kopyala 📋</button>`;
                chatBody.appendChild(tools);
            }
            
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        window.copyMessage = function(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const oldText = btn.innerText;
                btn.innerText = "Kopyalandı ✔️";
                setTimeout(() => btn.innerText = oldText, 2000);
            });
        };
        
        window.copyLastAiMessage = function(btn) {
            const text = "Merhaba! Ben Nomi, NewNorm AI'ın yapay zeka asistanıyım. Sana nasıl yardımcı olabilirim?";
            copyMessage(btn, text);
        }

        btnUndo.addEventListener('click', () => {
            if(lastUserMessage) chatInput.value = lastUserMessage;
        });

        async function sendMessage() {
            const msg = chatInput.value.trim();
            if (!msg) return;

            addMessage(msg, 'user');
            lastUserMessage = msg;
            chatInput.value = '';
            
            // Temporary typing indicator
            const typingBubble = document.createElement('div');
            typingBubble.className = `chat-bubble bubble-ai`;
            typingBubble.innerText = "Nomi düşünüyor...";
            typingBubble.id = "typingIndicator";
            chatBody.appendChild(typingBubble);
            chatBody.scrollTop = chatBody.scrollHeight;

            try {
                const response = await fetch('/api/sohbet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mesaj: msg, gecmis: chatHistory })
                });
                
                const data = await response.json();
                document.getElementById("typingIndicator").remove();
                
                if (data.basari) {
                    addMessage(data.yanit, 'ai');
                    chatHistory.push({ role: "user", content: msg });
                    chatHistory.push({ role: "assistant", content: data.yanit });
                } else {
                    addMessage("Hata: " + data.hata, 'ai');
                }
            } catch (error) {
                document.getElementById("typingIndicator").remove();
                addMessage("Bağlantı hatası oluştu.", 'ai');
            }
        }

        btnSendChat.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // --- 4. FORM API LOGIC ---
        const btnSubmitForm = document.getElementById('btnSubmitForm');
        const formStatus = document.getElementById('formStatus');

        btnSubmitForm.addEventListener('click', async () => {
            const payload = {
                isim: document.getElementById('isim').value,
                soyisim: document.getElementById('soyisim').value,
                eposta: document.getElementById('eposta').value,
                alan_kodu: document.getElementById('alan_kodu').value,
                telefon: document.getElementById('telefon').value,
                butce: document.getElementById('butce').value,
                aciklama: document.getElementById('aciklama').value
            };

            if(!payload.isim || !payload.telefon) {
                formStatus.style.color = "red";
                formStatus.innerText = "Lütfen Ad ve Telefon alanlarını doldurun.";
                return;
            }

            btnSubmitForm.innerText = "Gönderiliyor...";
            formStatus.innerText = "";

            try {
                const response = await fetch('/api/leads', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                
                if (data.basari) {
                    formStatus.style.color = "green";
                    formStatus.innerText = "Başvurunuz başarıyla alındı!";
                    btnSubmitForm.innerText = "Gönderildi ✔️";
                    document.getElementById('leadForm').reset();
                } else {
                    formStatus.style.color = "red";
                    formStatus.innerText = "Hata: " + data.hata;
                    btnSubmitForm.innerText = "Tekrar Dene";
                }
            } catch (error) {
                formStatus.style.color = "red";
                formStatus.innerText = "Bağlantı hatası.";
                btnSubmitForm.innerText = "Hemen Başvur";
            }
        });
    </script>
</body>
</html>
