<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomi Sohbet Botu</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: transparent; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .chat-container { width: 100%; height: 100%; background: #ffffff; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #1e293b; color: #ffffff; padding: 16px; display: flex; align-items: center; gap: 12px; }
        .chat-header i { font-size: 24px; color: #facc15; }
        .chat-header-info h3 { font-size: 16px; margin-bottom: 2px; }
        .chat-header-info p { font-size: 12px; color: #94a3b8; }
        .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f8fafc; scroll-behavior: smooth; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; position: relative; animation: fadeIn 0.3s ease-in-out; word-wrap: break-word; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.bot { background: #ffffff; color: #334155; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .message.user { background: #3b82f6; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 2px 5px rgba(59,130,246,0.2); }
        .chat-footer { padding: 12px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; }
        .chat-input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 20px; outline: none; font-size: 14px; transition: all 0.3s; }
        .chat-input:focus { border-color: #3b82f6; }
        .chat-btn { background: #3b82f6; color: #ffffff; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.3s; }
        .chat-btn:hover { background: #2563eb; }
        .typing-indicator { display: flex; gap: 4px; padding: 12px 16px; background: #ffffff; align-self: flex-start; border-radius: 16px; border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .typing-indicator span { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <i class="fa-solid fa-robot"></i>
            <div class="chat-header-info">
                <h3>Nomi (NewNorm AI)</h3>
                <p>Akıllı İç Mimarınız Çevrimiçi</p>
            </div>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="message bot">
                Merhaba! Ben Nomi, NewNorm'un yapay zeka destekli akıllı iç mimarıyım. Odanızın ölçülerini veya hayalinizdeki tasarımı bana anlatın, size en uygun yerleşim planını sunayım. 😊
            </div>
        </div>
        <form class="chat-footer" id="chatForm">
            <input type="text" id="chatInput" class="chat-input" placeholder="Mesajınızı yazınız..." autocomplete="off">
            <button type="submit" class="chat-btn"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>
    <script>
        const chatBody = document.getElementById('chatBody');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        let chatHistory = [];
        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = \message \\;
            msgDiv.innerHTML = text.replace(/\\n/g, '<br>');
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }
        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            chatBody.appendChild(typingDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }
        function hideTyping() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = chatInput.value.trim();
            if (!message) return;
            appendMessage('user', message);
            chatInput.value = '';
            showTyping();
            try {
                const response = await fetch('/api/sohbet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mesaj: message, gecmis: chatHistory })
                });
                const data = await response.json();
                hideTyping();
                if (response.ok && data.basari) {
                    appendMessage('bot', data.yanit);
                    chatHistory.push({ role: 'user', content: message });
                    chatHistory.push({ role: 'assistant', content: data.yanit });
                } else {
                    appendMessage('bot', 'Üzgünüm, bir hata oluştu: ' + (data.hata || 'Lütfen tekrar deneyin.'));
                }
            } catch (err) {
                hideTyping();
                appendMessage('bot', 'Sunucuya ulaşılamadı. Lütfen internet bağlantınızı kontrol edin.');
            }
        });
    </script>
</body>
</html>
