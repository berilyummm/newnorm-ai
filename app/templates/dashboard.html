<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewNorm AI Yönetim Paneli</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px; 
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h1 { margin: 0; font-size: 28px; font-weight: 600; color: var(--primary); }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 20px;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px 24px; border-bottom: 1px solid #e5e7eb; }
        th { 
            background-color: #f9fafb; 
            font-size: 13px; 
            text-transform: uppercase; 
            color: var(--text-muted);
            font-weight: 600;
        }
        td { font-size: 15px; }
        tr:hover { background-color: #f9fafb; }
        .badge {
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            background-color: #fef3c7; color: #b45309;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>NewNorm Müşteri Paneli</h1>
            <!-- Çıkış Yap butonu buradan tamamen silindi -->
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Sıra</th>
                        <th>İsim Soyisim</th>
                        <th>Telefon</th>
                        <th>Mesaj</th>
                        <th>Tarih</th>
                        <th>Durum</th>
                    </tr>
                </thead>
                <tbody id="leadsTableBody">
                    <tr><td colspan="6" style="text-align:center;">Veriler yükleniyor...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // API'den verileri çekip tabloya doldurma
        fetch('/api/leads')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('leadsTableBody');
                tbody.innerHTML = '';
                
                if(data.basari && data.leads.length > 0) {
                    data.leads.forEach((lead, index) => {
                        const tarih = new Date(lead.tarih).toLocaleString('tr-TR');
                        tbody.innerHTML += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${lead.isim}</td>
                                <td>${lead.telefon}</td>
                                <td>${lead.mesaj}</td>
                                <td>${tarih}</td>
                                <td><span class="badge">${lead.onay_durumu}</span></td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Henüz hiç müşteri kaydı yok.</td></tr>';
                }
            })
            .catch(err => {
                document.getElementById('leadsTableBody').innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Veri çekilirken hata oluştu.</td></tr>';
            });
    </script>
</body>
</html>
