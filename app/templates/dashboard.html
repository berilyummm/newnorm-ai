<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewNorm AI Yönetim Paneli</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px; 
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h1 { margin: 0; font-size: 28px; font-weight: 600; }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px 24px; border-bottom: 1px solid #e5e7eb; }
        th { 
            background-color: #f9fafb; 
            font-size: 13px; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            color: var(--text-muted);
            font-weight: 600;
        }
        td { font-size: 15px; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #f9fafb; }
        
        .badge {
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-bekliyor { background-color: #fef3c7; color: #b45309; }
        .badge-onaylandi { background-color: #d1fae5; color: #047857; }
        .badge-reddedildi { background-color: #fee2e2; color: #b91c1c; }
        
        .btn-group { display: flex; gap: 8px; }
        .btn {
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-approve { background-color: #ecfdf5; color: var(--success); border: 1px solid #a7f3d0; }
        .btn-approve:hover { background-color: #d1fae5; }
        
        .btn-reject { background-color: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
        .btn-reject:hover { background-color: #fee2e2; }
        
        .btn-wait { background-color: #fffbeb; color: var(--warning); border: 1px solid #fde68a; }
        .btn-wait:hover { background-color: #fef3c7; }
        
        .btn-delete { background-color: transparent; color: var(--text-muted); padding: 6px; }
        .btn-delete:hover { color: var(--danger); }
        
        .message-cell { max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Müşteri Adayı Yönetim Paneli</h1>
                <p style="color: var(--text-muted); margin-top: 5px;">Gelen tüm potansiyel müşteri formlarını buradan yönetin.</p>
            </div>
            <button class="btn" style="background: var(--primary); color: white; padding: 10px 20px;" onclick="veriCek()">Yenile</button>
        </div>
        
        <div class="card">
            <table id="leads-table">
                <thead>
                    <tr>
                        <th>İsim</th>
                        <th>Telefon</th>
                        <th>Mesaj</th>
                        <th>Durum</th>
                        <th>Tarih</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody id="leads-body">
                    <tr><td colspan="6" style="text-align: center; padding: 40px;">Yükleniyor...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function toggleMesaj(element) {
            if (element.style.whiteSpace === 'normal') {
                element.style.whiteSpace = 'nowrap';
            } else {
                element.style.whiteSpace = 'normal';
            }
        }

        function durumRengi(durum) {
            if (durum === 'Onaylandı') return 'badge-onaylandi';
            if (durum === 'Reddedildi') return 'badge-reddedildi';
            return 'badge-bekliyor';
        }

        function durumDegistir(id, yeniDurum) {
            fetch(`/api/leads/${id}/durum`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ durum: yeniDurum })
            })
            .then(res => res.json())
            .then(data => { if(data.basari) veriCek(); else alert("Hata: " + data.hata); })
            .catch(err => alert("Bağlantı hatası"));
        }

        function kayitSil(id) {
            if(confirm("Bu kaydı tamamen silmek istediğinize emin misiniz?")) {
                fetch(`/api/leads/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => { if(data.basari) veriCek(); else alert("Hata: " + data.hata); })
                .catch(err => alert("Bağlantı hatası"));
            }
        }

        function veriCek() {
            const tbody = document.getElementById('leads-body');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px;">Yükleniyor...</td></tr>';
            
            fetch('/api/leads')
                .then(response => response.json())
                .then(data => {
                    if (data.basari && data.veri.length > 0) {
                        tbody.innerHTML = '';
                        data.veri.forEach(lead => {
                            const tr = document.createElement('tr');
                            
                            // Tarih formatlama (Gün Ay Yıl Saat)
                            const dateObj = new Date(lead.tarih);
                            const tarihStr = dateObj.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).replace(',', '');
                            
                            tr.innerHTML = `
                                <td style="font-weight: 500;">${lead.isim}</td>
                                <td>${lead.telefon}</td>
                                <td class="message-cell" onclick="toggleMesaj(this)" title="Okumak için tıklayın">${lead.mesaj || '-'}</td>
                                <td><span class="badge ${durumRengi(lead.durum || 'Bekliyor')}">${lead.durum || 'Bekliyor'}</span></td>
                                <td style="color: #6b7280; font-size: 13px;">${tarihStr}</td>
                                <td>
                                    <div class="btn-group">
                                        <button class="btn btn-approve" title="Onayla" onclick="durumDegistir(${lead.id}, 'Onaylandı')">✅</button>
                                        <button class="btn btn-wait" title="Beklemeye Al" onclick="durumDegistir(${lead.id}, 'Bekliyor')">⏳</button>
                                        <button class="btn btn-reject" title="Reddet" onclick="durumDegistir(${lead.id}, 'Reddedildi')">❌</button>
                                        <button class="btn btn-delete" title="Sil" onclick="kayitSil(${lead.id})">🗑️</button>
                                    </div>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    } else {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #6b7280;">Henüz hiç müşteri kaydı yok.</td></tr>';
                    }
                })
                .catch(error => {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #ef4444;">Veriler yüklenirken bir hata oluştu.</td></tr>';
                    console.error(error);
                });
        }
        
        // Sayfa yüklendiğinde verileri çek
        window.onload = veriCek;
    </script>
</body>
</html>
